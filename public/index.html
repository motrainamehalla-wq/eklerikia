<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كلية البابا كيرلس والبابا شنودة الإكليريكية - المحلة الكبرى</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<style>
:root{
  --navy:#0e2140; --navy2:#16305a; --gold:#c9a24b; --gold-light:#e9d8a6;
  --cream:#f7f3ea; --ink:#1c2230; --muted:#6b7280; --danger:#a33; --ok:#2e7d4f;
  --card:#ffffff; --border:#e4ddc9;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Cairo',sans-serif;min-height:100%}
h1,h2,h3{font-family:'Amiri',serif}
header.top{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding:18px 20px calc(18px + env(safe-area-inset-top,0px));text-align:center;position:relative}
header.top .logo{width:78px;height:78px;display:block;margin:0 auto 8px;border-radius:50%}
header.top:before{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
header.top h1{margin:0;font-size:20px;line-height:1.5}
header.top p{margin:4px 0 0;color:var(--gold-light);font-size:13px}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{flex:1;min-width:180px;margin-bottom:12px;text-align:right}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:14px;background:#fff}
input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
button{cursor:pointer;font-family:inherit;font-weight:700;border:none;border-radius:7px;padding:10px 18px;font-size:14px}
button:disabled{opacity:.6;cursor:default}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-navy{background:var(--navy);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--navy);color:var(--navy)}
.btn-danger{background:#fbeaea;color:var(--danger)}
.btn-sm{padding:6px 12px;font-size:12.5px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:9px 16px;border-radius:20px;background:#fff;border:1px solid var(--border);font-weight:700;font-size:13px;cursor:pointer}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:700}
.badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700}
.badge.pending{background:#fff3d6;color:#8a6d1a}
.badge.approved{background:#e1f3e7;color:var(--ok)}
.badge.present{background:#e1f3e7;color:var(--ok)}
.badge.absent{background:#fbeaea;color:var(--danger)}
.muted{color:var(--muted);font-size:13px}
.center{text-align:center}
.hidden{display:none !important}
.msg{padding:10px 14px;border-radius:7px;font-size:13.5px;margin-bottom:12px}
.msg.err{background:#fbeaea;color:var(--danger)}
.msg.ok{background:#e1f3e7;color:var(--ok)}
#qrbox{width:100%;max-width:260px;margin:10px auto}
video{width:100%;max-width:340px;border-radius:8px;background:#000}
.qr-print{text-align:center;padding:20px;border:2px dashed var(--gold);border-radius:10px;margin-top:14px}
.small-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
@media print{header.top,.no-print{display:none!important} body{background:#fff}}
</style>
</head>
<body>
<header class="top">
  <img class="logo" src="/logo.png" alt="شعار الكلية">
  <h1>كلية البابا كيرلس عمود الإيمان والبابا شنودة الثالث الإكليريكية</h1>
  <p>فرع المحلة الكبرى</p>
</header>
<div class="wrap" id="app"></div>

<script>
// ---------- API helper ----------
let TOKEN = sessionStorage.getItem('sem_token') || null;
let ROLE = sessionStorage.getItem('sem_role') || null;
let ME = null;

async function api(path, method='GET', body){
  const headers = {'Content-Type':'application/json'};
  if(TOKEN) headers['Authorization'] = 'Bearer '+TOKEN;
  const res = await fetch('/api'+path, {method, headers, body: body?JSON.stringify(body):undefined});
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new Error(data.error || 'حدث خطأ، حاول مرة أخرى');
  return data;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7) }
function todayISO(){ return new Date().toISOString().slice(0,10) }

const app = document.getElementById('app');

// ---------- router ----------
async function render(){
  if(!TOKEN){ renderLogin(); return; }
  try{
    if(ROLE==='admin'){ await renderAdmin(); } else { await renderMember(); }
  }catch(e){
    logout();
  }
}

// ================= LOGIN / REGISTER =================
let authMode='login';
function renderLogin(){
  app.innerHTML = `
  <div class="card" style="max-width:440px;margin:20px auto">
    <div class="tabs">
      <div class="tab ${authMode==='login'?'active':''}" onclick="authMode='login';render()">تسجيل الدخول</div>
      <div class="tab ${authMode==='register'?'active':''}" onclick="authMode='register';render()">تسجيل عضو جديد</div>
    </div>
    <div id="msgbox"></div>
    ${authMode==='login' ? loginForm() : registerForm()}
  </div>`;
}
function loginForm(){
  return `
  <div class="field"><label>الرقم القومى (أو "admin" للمدير)</label><input id="li-id" placeholder="الرقم القومى"></div>
  <div class="field"><label>كلمة المرور</label><input id="li-pass" type="password" placeholder="كلمة المرور"></div>
  <button class="btn-navy" style="width:100%" onclick="doLogin()">دخول</button>`;
}
const GRADES = ['الأولى','الثانية','الثالثة','الرابعة'];
const LECTURE_GRADES = [...GRADES,'عام'];
function gradeOptions(selected){
  return GRADES.map(g=>`<option value="${g}" ${selected===g?'selected':''}>${g}</option>`).join('');
}
function registerForm(){
  return `
  <div class="field"><label>الاسم بالكامل</label><input id="r-name"></div>
  <div class="field"><label>الرقم القومى</label><input id="r-nid" maxlength="14"></div>
  <div class="field"><label>الكنيسة التابع لها</label><input id="r-church"></div>
  <div class="field"><label>الفرقة</label>
    <select id="r-grade"><option value="">-- اختر الفرقة --</option>${gradeOptions()}</select>
  </div>
  <div class="field"><label>كلمة المرور</label><input id="r-pass" type="password"></div>
  <button class="btn-gold" style="width:100%" onclick="doRegister()">إرسال طلب التسجيل</button>
  <p class="muted center" style="margin-top:10px">سيتم تفعيل حسابك بعد موافقة الإدارة</p>`;
}
function msg(text,type){ const b=document.getElementById('msgbox'); if(b) b.innerHTML = `<div class="msg ${type}">${text}</div>`; }

async function doLogin(){
  const id=document.getElementById('li-id').value.trim();
  const pass=document.getElementById('li-pass').value;
  try{
    const data = await api('/login','POST',{nationalId:id, password:pass});
    TOKEN=data.token; ROLE=data.role; ME=data.user||null;
    sessionStorage.setItem('sem_token',TOKEN); sessionStorage.setItem('sem_role',ROLE);
    render();
  }catch(e){ msg(e.message,'err'); }
}
async function doRegister(){
  const name=document.getElementById('r-name').value.trim();
  const nid=document.getElementById('r-nid').value.trim();
  const church=document.getElementById('r-church').value.trim();
  const grade=document.getElementById('r-grade').value;
  const pass=document.getElementById('r-pass').value;
  if(!name||!nid||!church||!grade||!pass){ msg('من فضلك أكمل جميع البيانات','err'); return; }
  try{
    await api('/register','POST',{name, nationalId:nid, church, grade, password:pass});
    authMode='login'; render();
    setTimeout(()=>msg('تم إرسال طلبك بنجاح، بانتظار موافقة الإدارة','ok'),0);
  }catch(e){ msg(e.message,'err'); }
}
async function logout(){
  try{ if(TOKEN) await api('/logout','POST'); }catch(e){}
  TOKEN=null; ROLE=null; ME=null;
  sessionStorage.removeItem('sem_token'); sessionStorage.removeItem('sem_role');
  render();
}

// ================= MEMBER VIEW =================
let memberTab='profile';
async function renderMember(){
  if(!ME){ ME = await api('/me'); }
  app.innerHTML = `
  <div class="row" style="justify-content:space-between;align-items:center">
    <h2 style="margin:0">أهلاً، ${ME.name}</h2>
    <button class="btn-outline btn-sm no-print" onclick="logout()">خروج</button>
  </div>
  <div class="tabs">
    <div class="tab ${memberTab==='profile'?'active':''}" onclick="memberTab='profile';renderMember()">بياناتى</div>
    <div class="tab ${memberTab==='schedule'?'active':''}" onclick="memberTab='schedule';renderMember()">جدول المحاضرات</div>
    <div class="tab ${memberTab==='attend'?'active':''}" onclick="memberTab='attend';renderMember()">تسجيل الحضور</div>
  </div>
  <div id="mtab"><p class="muted center">جارِ التحميل...</p></div>`;
  if(memberTab==='profile') renderMemberProfile();
  if(memberTab==='schedule') await renderScheduleView();
  if(memberTab==='attend') await renderMemberAttend();
}
function renderMemberProfile(){
  document.getElementById('mtab').innerHTML=`
  <div class="card">
    <div class="row">
      <div class="field"><label>الاسم</label><input id="p-name" value="${ME.name}"></div>
      <div class="field"><label>الكنيسة</label><input id="p-church" value="${ME.church}"></div>
    </div>
    <div class="row">
      <div class="field"><label>الرقم القومى</label><input value="${ME.nationalId}" disabled></div>
      <div class="field"><label>الفرقة</label><input value="${ME.grade||'لم تُحدد بعد (راجع الإدارة)'}" disabled></div>
    </div>
    <div class="row">
      <div class="field"><label>كلمة مرور جديدة (اتركها فارغة لعدم التغيير)</label><input id="p-pass" type="password"></div>
    </div>
    <button class="btn-navy" onclick="saveProfile()">حفظ التعديلات</button>
    <div id="pmsg"></div>
  </div>`;
}
async function saveProfile(){
  const name=document.getElementById('p-name').value.trim();
  const church=document.getElementById('p-church').value.trim();
  const password=document.getElementById('p-pass').value;
  try{
    await api('/me','PUT',{name, church, password: password||undefined});
    if(name) ME.name=name; if(church) ME.church=church;
    document.getElementById('pmsg').innerHTML='<div class="msg ok">تم حفظ البيانات</div>';
  }catch(e){ document.getElementById('pmsg').innerHTML=`<div class="msg err">${e.message}</div>`; }
}
async function renderScheduleView(){
  const all = await api('/lectures');
  const lec = all.filter(l=>l.grade==='عام' || l.grade===ME.grade).slice().sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('mtab').innerHTML=`
  <div class="card">
    <h3 style="margin-top:0">جدول محاضرات الكلية ${ME.grade?`- الفرقة ${ME.grade}`:''}</h3>
    ${lec.length? `<table><tr><th>الموضوع</th><th>التاريخ</th><th>الوقت</th><th>الفرقة</th></tr>
      ${lec.map(l=>`<tr><td>${l.title}</td><td>${l.date}</td><td>${l.time||'-'}</td><td>${l.grade}</td></tr>`).join('')}
      </table>` : `<p class="muted">لم يتم إضافة جدول بعد</p>`}
  </div>`;
}
async function renderMemberAttend(){
  document.getElementById('mtab').innerHTML=`
  <div class="card center">
    <h3 style="margin-top:0">مسح كود المحاضرة</h3>
    <p class="muted">وجّه كاميرا الموبايل نحو كود المحاضرة الظاهر من المسؤول</p>
    <button class="btn-gold" onclick="startScan()">فتح الكاميرا والمسح</button>
    <video id="scan-video" class="hidden" playsinline muted></video>
    <canvas id="scan-canvas" class="hidden"></canvas>
    <div id="scan-result"></div>
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
      <p class="muted" style="margin-bottom:8px">لو المسح مش شغال، اكتب كود المحاضرة يدويًا (مكتوب تحت الـ QR):</p>
      <div class="row" style="justify-content:center">
        <input id="manual-code" placeholder="مثال: LEC-AB12CD34" style="max-width:220px;text-align:center">
        <button class="btn-navy" onclick="submitManualCode()">تسجيل</button>
      </div>
    </div>
  </div>
  <div class="card">
    <h3 style="margin-top:0">سجل حضورى</h3>
    <div id="my-att-table"><p class="muted">جارِ التحميل...</p></div>
  </div>`;
  await refreshMyAttendanceTable();
}
async function refreshMyAttendanceTable(){
  const [mine, all] = await Promise.all([api('/attendance/mine'), api('/lectures')]);
  const lectures = all.filter(l=>l.grade==='عام' || l.grade===ME.grade);
  const box = document.getElementById('my-att-table');
  if(!lectures.length){ box.innerHTML='<p class="muted">لا توجد محاضرات تخص فرقتك بعد</p>'; return; }
  const rows = lectures.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(l=>{
    const present = mine.some(a=>a.lectureId===l.id);
    return `<tr><td>${l.title}</td><td>${l.date}</td><td><span class="badge ${present?'present':'absent'}">${present?'حاضر':'غائب'}</span></td></tr>`;
  }).join('');
  box.innerHTML = `<table><tr><th>المحاضرة</th><th>التاريخ</th><th>الحالة</th></tr>${rows}</table>`;
}
let scanStream=null;
function startScan(){
  if(typeof jsQR==='undefined'){
    document.getElementById('scan-result').innerHTML='<div class="msg err">تعذر تحميل مكتبة قراءة الكود (مشكلة اتصال بالإنترنت)، استخدم الإدخال اليدوى تحت</div>';
    return;
  }
  const video=document.getElementById('scan-video');
  const canvas=document.getElementById('scan-canvas');
  video.classList.remove('hidden');
  document.getElementById('scan-result').innerHTML='';
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}).then(stream=>{
    scanStream=stream; video.srcObject=stream; video.play();
    requestAnimationFrame(tick);
  }).catch(()=>{ document.getElementById('scan-result').innerHTML='<div class="msg err">تعذر فتح الكاميرا، تأكد من السماح بالوصول أو استخدم الإدخال اليدوى تحت</div>'; });
  let lastTry=0;
  function tick(ts){
    if(!scanStream) return;
    if(video.readyState===video.HAVE_ENOUGH_DATA && ts-lastTry>150){
      lastTry=ts;
      try{
        const maxW=480;
        const scale=Math.min(1, maxW/video.videoWidth);
        canvas.width=Math.round(video.videoWidth*scale);
        canvas.height=Math.round(video.videoHeight*scale);
        const ctx=canvas.getContext('2d',{willReadFrequently:true});
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});
        if(code && code.data){ handleScanResult(code.data); return; }
      }catch(err){ /* ignore single-frame errors, keep scanning */ }
    }
    requestAnimationFrame(tick);
  }
}
async function submitManualCode(){
  const input=document.getElementById('manual-code');
  const code=input.value.trim();
  if(!code) return;
  await handleScanResult(code);
  input.value='';
}
function stopScan(){ if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; } document.getElementById('scan-video')?.classList.add('hidden'); }
async function handleScanResult(data){
  stopScan();
  const box=document.getElementById('scan-result');
  try{
    const result = await api('/attendance/scan','POST',{code:data.trim()});
    box.innerHTML = result.already
      ? `<div class="msg ok">تم تسجيل حضورك مسبقاً فى: ${result.title}</div>`
      : `<div class="msg ok">تم تسجيل حضورك بنجاح فى محاضرة: ${result.title}</div>`;
    await refreshMyAttendanceTable();
  }catch(e){ box.innerHTML = `<div class="msg err">${e.message}</div>`; }
}

// ================= ADMIN VIEW =================
let adminTab='members';
let selectedLectureId=null;
async function renderAdmin(){
  app.innerHTML=`
  <div class="row" style="justify-content:space-between;align-items:center">
    <h2 style="margin:0">لوحة تحكم الإدارة</h2>
    <button class="btn-outline btn-sm no-print" onclick="logout()">خروج</button>
  </div>
  <div class="tabs no-print">
    <div class="tab ${adminTab==='members'?'active':''}" onclick="adminTab='members';renderAdmin()">الأعضاء</div>
    <div class="tab ${adminTab==='schedule'?'active':''}" onclick="adminTab='schedule';renderAdmin()">الجدول</div>
    <div class="tab ${adminTab==='attend'?'active':''}" onclick="adminTab='attend';renderAdmin()">تسجيل الحضور</div>
    <div class="tab ${adminTab==='reports'?'active':''}" onclick="adminTab='reports';renderAdmin()">التقارير</div>
    <div class="tab ${adminTab==='settings'?'active':''}" onclick="adminTab='settings';renderAdmin()">الإعدادات</div>
  </div>
  <div id="atab"><p class="muted center">جارِ التحميل...</p></div>`;
  const fn = {members:renderAdminMembers, schedule:renderAdminSchedule, attend:renderAdminAttend, reports:renderAdminReports, settings:renderAdminSettings}[adminTab];
  await fn();
}
let editingUserId=null;
let adminUsersCache=[];
let showImportBox=false;
async function renderAdminMembers(){
  const users = await api('/users');
  adminUsersCache = users;
  const pending = users.filter(u=>u.status==='pending');
  const approved = users.filter(u=>u.status==='approved');
  document.getElementById('atab').innerHTML=`
  <div class="card">
    <h3 style="margin-top:0">طلبات تسجيل جديدة (${pending.length})</h3>
    ${pending.length? `<table><tr><th>الاسم</th><th>الرقم القومى</th><th>الكنيسة</th><th>الفرقة</th><th></th></tr>
    ${pending.map(u=>`<tr><td>${u.name}</td><td>${u.nationalId}</td><td>${u.church}</td><td>${u.grade||'-'}</td>
      <td><button class="btn-gold btn-sm" onclick="approveUser('${u.id}')">موافقة</button>
      <button class="btn-danger btn-sm" onclick="rejectUser('${u.id}')">رفض</button></td></tr>`).join('')}
    </table>` : '<p class="muted">لا توجد طلبات جديدة</p>'}
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <h3 style="margin:0">الأعضاء المفعّلون (${approved.length})</h3>
      <button class="btn-outline btn-sm" onclick="showImportBox=!showImportBox;renderAdminMembers()">استيراد أعضاء دفعة واحدة</button>
    </div>
    ${approved.length? `<table><tr><th>الاسم</th><th>الرقم القومى</th><th>الكنيسة</th><th>الفرقة</th><th></th></tr>
    ${approved.map(u=>`<tr><td>${u.name}</td><td>${u.nationalId}</td><td>${u.church}</td><td>${u.grade||'<span class="badge pending">غير محددة</span>'}</td>
      <td><button class="btn-outline btn-sm" onclick="editingUserId='${u.id}';renderAdminMembers()">تعديل</button>
      <button class="btn-danger btn-sm" onclick="removeUser('${u.id}')">حذف</button></td></tr>`).join('')}
    </table>` : '<p class="muted">لا يوجد أعضاء بعد</p>'}
  </div>
  <div id="import-box"></div>
  <div id="edit-user-box"></div>`;
  if(showImportBox) renderImportBox();
  if(editingUserId) renderEditUserForm();
}
function renderImportBox(){
  document.getElementById('import-box').innerHTML=`
  <div class="card">
    <h3 style="margin-top:0">استيراد أعضاء دفعة واحدة</h3>
    <p class="muted">اكتب عضو فى كل سطر، والبيانات مفصولة بفاصلة (,) بالترتيب التالى:</p>
    <p class="muted" style="font-weight:700">الاسم , الرقم القومى , الكنيسة , الفرقة (الأولى/الثانية/الثالثة/الرابعة) , كلمة المرور (اختيارى)</p>
    <p class="muted">لو سبت خانة كلمة المرور فارغة، هيبقى الرقم القومى هو كلمة المرور المبدئية للعضو.</p>
    <textarea id="import-text" rows="8" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:13.5px" placeholder="مينا سمير فام, 29801012345678, كنيسة مارجرجس, الأولى
مريم عادل حنا, 30002023456789, كنيسة العذراء, الثانية, 123456"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn-navy" onclick="runBulkImport()">استيراد الآن</button>
      <button class="btn-outline" onclick="showImportBox=false;renderAdminMembers()">إلغاء</button>
    </div>
    <div id="import-result"></div>
  </div>`;
}
async function runBulkImport(){
  const text = document.getElementById('import-text').value.trim();
  if(!text) return;
  const rows = text.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{
    const parts = line.split(',').map(p=>p.trim());
    return { name:parts[0]||'', nationalId:parts[1]||'', church:parts[2]||'', grade:parts[3]||'', password:parts[4]||'' };
  });
  try{
    const result = await api('/users/bulk-import','POST',{rows});
    let html = `<div class="msg ok">تم استيراد ${result.created} عضو بنجاح</div>`;
    if(result.skipped && result.skipped.length){
      html += `<div class="msg err">تم تجاهل ${result.skipped.length} سطر:<br>${result.skipped.map(s=>`- ${s.row.name||s.row.nationalId||'?'}: ${s.reason}`).join('<br>')}</div>`;
    }
    document.getElementById('import-result').innerHTML = html;
    showImportBox=false;
    renderAdminMembers();
  }catch(e){ document.getElementById('import-result').innerHTML = `<div class="msg err">${e.message}</div>`; }
}
function renderEditUserForm(){
  const u = adminUsersCache.find(x=>x.id===editingUserId);
  if(!u) return;
  document.getElementById('edit-user-box').innerHTML=`
  <div class="card" style="max-width:480px">
    <h3 style="margin-top:0">تعديل بيانات: ${u.name}</h3>
    <div class="field"><label>الاسم</label><input id="eu-name" value="${u.name}"></div>
    <div class="field"><label>الكنيسة</label><input id="eu-church" value="${u.church}"></div>
    <div class="field"><label>الفرقة</label>
      <select id="eu-grade"><option value="">-- بدون تغيير --</option>${gradeOptions(u.grade)}</select>
    </div>
    <div class="field"><label>كلمة مرور جديدة (اتركها فارغة لعدم التغيير)</label><input id="eu-pass" type="password"></div>
    <button class="btn-navy" onclick="saveUserEdit('${u.id}')">حفظ</button>
    <button class="btn-outline" onclick="editingUserId=null;renderAdminMembers()">إلغاء</button>
    <div id="eumsg"></div>
  </div>`;
}
async function saveUserEdit(id){
  const name=document.getElementById('eu-name').value.trim();
  const church=document.getElementById('eu-church').value.trim();
  const grade=document.getElementById('eu-grade').value;
  const password=document.getElementById('eu-pass').value;
  try{
    await api(`/users/${id}`,'PUT',{name, church, grade: grade||undefined, password: password||undefined});
    editingUserId=null;
    renderAdminMembers();
  }catch(e){ document.getElementById('eumsg').innerHTML=`<div class="msg err">${e.message}</div>`; }
}
async function approveUser(id){ await api(`/users/${id}/approve`,'POST'); renderAdminMembers(); }
async function rejectUser(id){ await api(`/users/${id}`,'DELETE'); renderAdminMembers(); }
async function removeUser(id){ if(confirm('حذف هذا العضو نهائياً؟')){ await api(`/users/${id}`,'DELETE'); renderAdminMembers(); } }

async function renderAdminSchedule(){
  const lec = (await api('/lectures')).slice().sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('atab').innerHTML=`
  <div class="card">
    <h3 style="margin-top:0">إضافة محاضرة للجدول</h3>
    <div class="row">
      <div class="field"><label>موضوع المحاضرة</label><input id="s-title"></div>
      <div class="field"><label>التاريخ</label><input id="s-date" type="date" value="${todayISO()}"></div>
      <div class="field"><label>الوقت</label><input id="s-time" type="time"></div>
      <div class="field"><label>الفرقة المستهدفة</label>
        <select id="s-grade">${LECTURE_GRADES.map(g=>`<option value="${g}">${g}</option>`).join('')}</select>
      </div>
    </div>
    <button class="btn-navy" onclick="addLecture()">إضافة للجدول</button>
  </div>
  <div class="card">
    <h3 style="margin-top:0">الجدول الحالى</h3>
    ${lec.length? `<table><tr><th>الموضوع</th><th>التاريخ</th><th>الوقت</th><th>الفرقة</th><th></th></tr>
    ${lec.map(l=>`<tr><td>${l.title}</td><td>${l.date}</td><td>${l.time||'-'}</td><td>${l.grade}</td>
      <td><button class="btn-danger btn-sm" onclick="delLecture('${l.id}')">حذف</button></td></tr>`).join('')}
    </table>`:'<p class="muted">الجدول فارغ</p>'}
  </div>`;
}
async function addLecture(){
  const title=document.getElementById('s-title').value.trim();
  const date=document.getElementById('s-date').value;
  const grade=document.getElementById('s-grade').value;
  const time=document.getElementById('s-time').value;
  if(!title||!date) return;
  await api('/lectures','POST',{title,date,time,grade});
  renderAdminSchedule();
}
async function delLecture(id){ if(confirm('حذف هذه المحاضرة وسجلات حضورها؟')){ await api(`/lectures/${id}`,'DELETE'); renderAdminSchedule(); } }

async function renderAdminAttend(){
  const lec = (await api('/lectures')).slice().sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('atab').innerHTML=`
  <div class="card no-print">
    <h3 style="margin-top:0">تسجيل الحضور اليومى</h3>
    <div class="field"><label>اختر محاضرة (حسب التاريخ)</label>
      <select id="a-select" onchange="selectedLectureId=this.value;renderAdminAttend()">
        <option value="">-- اختر --</option>
        ${lec.map(l=>`<option value="${l.id}" ${selectedLectureId===l.id?'selected':''}>${l.date} - ${l.title} (${l.grade})</option>`).join('')}
      </select>
    </div>
  </div>
  <div id="lecinfo"><p class="muted center">${selectedLectureId? 'جارِ التحميل...':''}</p></div>`;
  if(selectedLectureId) await renderLectureAttendPanel(lec.find(l=>l.id===selectedLectureId));
}
async function renderLectureAttendPanel(l){
  if(!l){ document.getElementById('lecinfo').innerHTML=''; return; }
  const [users, att] = await Promise.all([api('/users'), api(`/attendance?lectureId=${l.id}`)]);
  const approved = users.filter(u=>u.status==='approved' && (l.grade==='عام' || u.grade===l.grade));
  document.getElementById('lecinfo').innerHTML=`
  <div class="card">
    <div class="qr-print">
      <div class="small-title">كود المحاضرة</div>
      <h3>${l.title} - ${l.date} (${l.grade})</h3>
      <div id="qrbox"></div>
      <p class="muted">${l.code}</p>
      <button class="btn-outline btn-sm no-print" onclick="window.print()">طباعة الكود</button>
    </div>
  </div>
  <div class="card no-print">
    <h3 style="margin-top:0">تسجيل يدوى للحضور (${att.length}/${approved.length})</h3>
    ${approved.length? `<table><tr><th>الاسم</th><th>الكنيسة</th><th>الفرقة</th><th>الحالة</th><th></th></tr>
    ${approved.map(u=>{
      const present = att.some(a=>a.userId===u.id);
      return `<tr><td>${u.name}</td><td>${u.church}</td><td>${u.grade||'-'}</td>
        <td><span class="badge ${present?'present':'absent'}">${present?'حاضر':'غائب'}</span></td>
        <td><button class="btn-outline btn-sm" onclick="toggleAttend('${l.id}','${u.id}')">${present?'إلغاء':'تحضير'}</button></td></tr>`;
    }).join('')}
    </table>` : '<p class="muted">لا يوجد أعضاء بفرقة تخص هذه المحاضرة</p>'}
  </div>`;
  new QRCode(document.getElementById('qrbox'),{text:l.code,width:180,height:180,colorDark:'#0e2140',colorLight:'#fff'});
}
async function toggleAttend(lid,uid_){
  await api('/attendance/toggle','POST',{lectureId:lid, userId:uid_});
  const lec = await api('/lectures');
  await renderLectureAttendPanel(lec.find(l=>l.id===lid));
}

async function renderAdminReports(){
  const [users, lectures, attendance] = await Promise.all([api('/users'), api('/lectures'), api('/attendance')]);
  const approved = users.filter(u=>u.status==='approved');
  const applicableMembers = l => approved.filter(u=> l.grade==='عام' || u.grade===l.grade);
  const applicableLectures = u => lectures.filter(l=> l.grade==='عام' || l.grade===u.grade);
  let totalSlots=0, totalPresent=attendance.length;
  lectures.forEach(l=>{ totalSlots += applicableMembers(l).length; });
  const absenceRate = totalSlots? (((totalSlots-totalPresent)/totalSlots)*100).toFixed(1):'0';
  document.getElementById('atab').innerHTML=`
  <div class="card">
    <div class="row no-print">
      <button class="btn-outline btn-sm" onclick="window.print()">طباعة التقرير</button>
    </div>
    <h3 style="margin-top:0">التقرير العام</h3>
    <p>عدد الأعضاء: <b>${approved.length}</b> — عدد المحاضرات: <b>${lectures.length}</b></p>
    <p>نسبة الغياب العامة: <b style="color:var(--danger)">${absenceRate}%</b></p>
  </div>
  <div class="card">
    <h3 style="margin-top:0">ملخص حسب الفرقة</h3>
    <table><tr><th>الفرقة</th><th>عدد الأعضاء</th><th>المحاضرات الخاصة بها</th><th>نسبة الغياب</th></tr>
    ${GRADES.map(g=>{
      const members = approved.filter(u=>u.grade===g);
      const gLectures = lectures.filter(l=>l.grade===g || l.grade==='عام');
      const slots = members.length*gLectures.length;
      const present = attendance.filter(a=> gLectures.some(l=>l.id===a.lectureId) && members.some(m=>m.id===a.userId)).length;
      const pct = slots? (((slots-present)/slots)*100).toFixed(0):'0';
      return `<tr><td>${g}</td><td>${members.length}</td><td>${gLectures.length}</td><td>${pct}%</td></tr>`;
    }).join('')}</table>
  </div>
  <div class="card">
    <h3 style="margin-top:0">الغياب اليومى (لكل محاضرة)</h3>
    ${lectures.length? `<table><tr><th>المحاضرة</th><th>التاريخ</th><th>الفرقة</th><th>حاضر</th><th>غائب</th><th>نسبة الغياب</th></tr>
    ${lectures.map(l=>{
      const members = applicableMembers(l);
      const present = attendance.filter(a=>a.lectureId===l.id).length;
      const absent = members.length-present;
      const pct = members.length? ((absent/members.length)*100).toFixed(0):0;
      return `<tr><td>${l.title}</td><td>${l.date}</td><td>${l.grade}</td><td>${present}</td><td>${absent}</td><td>${pct}%</td></tr>`;
    }).join('')}</table>`:'<p class="muted">لا توجد محاضرات</p>'}
  </div>
  <div class="card">
    <h3 style="margin-top:0">غياب كل عضو</h3>
    ${approved.length? `<table><tr><th>الاسم</th><th>الكنيسة</th><th>الفرقة</th><th>حضر</th><th>غاب</th><th>نسبة الغياب</th></tr>
    ${approved.map(u=>{
      const relevant = applicableLectures(u);
      const present = attendance.filter(a=>a.userId===u.id && relevant.some(l=>l.id===a.lectureId)).length;
      const absent = relevant.length-present;
      const pct = relevant.length? ((absent/relevant.length)*100).toFixed(0):0;
      return `<tr><td>${u.name}</td><td>${u.church}</td><td>${u.grade||'-'}</td><td>${present}</td><td>${absent}</td><td>${pct}%</td></tr>`;
    }).join('')}</table>`:'<p class="muted">لا يوجد أعضاء</p>'}
  </div>`;
}
function renderAdminSettings(){
  document.getElementById('atab').innerHTML=`
  <div class="card" style="max-width:400px">
    <h3 style="margin-top:0">تغيير كلمة مرور المدير</h3>
    <div class="field"><label>كلمة المرور الجديدة</label><input id="ap-new" type="password"></div>
    <button class="btn-navy" onclick="changeAdminPass()">حفظ</button>
    <div id="apmsg"></div>
  </div>`;
}
async function changeAdminPass(){
  const v=document.getElementById('ap-new').value;
  try{
    await api('/admin/change-password','POST',{newPassword:v});
    document.getElementById('apmsg').innerHTML='<div class="msg ok">تم تغيير كلمة المرور</div>';
  }catch(e){ document.getElementById('apmsg').innerHTML=`<div class="msg err">${e.message}</div>`; }
}

render();
</script>
